name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# A push and a pull_request event fire for the same commit on a PR branch, and a new push
# supersedes the previous run. Without this every PR ran CI twice and nothing was cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pnpm/action-setup has to come first: setup-node's `cache: pnpm` shells out to pnpm
      # to find the store path and fails if pnpm is not on PATH yet.
      - uses: pnpm/action-setup@v6
        # No version pinned here on purpose — it comes from `packageManager` in
        # package.json, and naming it in two places is how the two drift apart.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          # Caches the pnpm store keyed on the pnpm-lock.yaml hash; setup-node computes the
          # key itself, so there is no separate actions/cache step to keep in sync.
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `biome ci` is the non-writing form of `biome check`: lint rules, formatter and
      # import order in one pass, so there is no second formatting command to run.
      - run: pnpm lint:ci

  test:
    name: Test (node ${{ matrix.node }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # package.json declares engines.node >= 20.12, which is a claim until CI runs on it.
        node: ['20.12', '22', '24']
        os: [ubuntu-latest]
        include:
          # One Windows leg rather than a full cross-product. Nothing under src/ is
          # OS-sensitive — it runs on Google's V8, not on this runner. What Windows does
          # exercise is scripts/build.js, which walks the tree with path.join and then
          # normalises the separators back out for the banner comments it writes into the
          # bundle, and the path handling in test/__mocks__/loader.js. Those are exactly
          # the things that fail by producing a bundle that differs from the Linux one,
          # which is the kind of difference nobody notices until it matters.
          - os: windows-latest
            node: '22'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:ci
      # No coverage upload. test/__mocks__/loader.js loads the sources with indirect eval
      # so they land in one shared global scope, the way Apps Script runs them, and neither
      # Jest coverage provider can attribute anything to an eval'd string. A report would
      # read 0% for all of src/ and mean nothing. See CONTRIBUTING.md.

  build:
    name: Build bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm build:example

      # The bundle is the deliverable — it is the file someone pastes into the Apps Script
      # editor — so make it downloadable from any green run, not only from a tagged release.
      - uses: actions/upload-artifact@v7
        with:
          name: bundles
          path: dist/*.gs
          retention-days: 30
