# gs-config-template CI/CD.
#
# On merge requests  → validate (biome) + build + test.
# On push to main   → validate (biome) + build + test + deploy:gas:dev (manual gate).
# On tag staging-*  → same + deploy:gas:staging (manual gate).
# On tag v* (semver) → same + deploy:gas:prod (manual gate).
#
# Required CI/CD variables:
#
#   CLASP_CREDENTIALS  (File variable, scope `*` or per env)
#   CLASP_SCRIPT_ID    (Variable, environment-scoped: dev / staging / prod)

# Declare all stages explicitly so the local file wins over any partial
# `stages:` list in the included templates.
stages:
  - validate
  - build
  - test
  - deploy

include:
  - project: "quality-game-core/shared/ci-templates"
    ref: main
    file: "/pipelines/typescript-mini.yml"
  - project: "quality-game-core/shared/ci-templates"
    ref: main
    file: "/pipelines/gas-clasp-deploy.yml"

# Restrict pipelines: MR events and pushes to the default branch only.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Expose the compiled bundle so the deploy jobs can pick it up.
build:
  artifacts:
    paths:
      - dist/bundle.gs
    expire_in: 30 days

# Gate every deploy behind a manual trigger.
deploy:gas:dev:
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual

deploy:gas:staging:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^staging-/'
      when: manual

deploy:gas:prod:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
      when: manual
